<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>TADC Blocker</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                width: 100%;
                height: 100%;
            }
            body {
                min-height: 100vh;
                background: #000;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .icon-wrap img {
                width: 72px;
                height: 72px;
                object-fit: contain;
                border-radius: 16px;
                display: block;
                opacity: 0;
                animation: appear 0.4s ease 0.1s forwards;
            }
            @keyframes appear {
                to {
                    opacity: 1;
                }
            }
        </style>
    </head>
    <body>
        <div class="icon-wrap">
            <img
                src="icon.png"
                alt="TADC Blocker"
                onerror="
                    this.src = '../icon.png';
                    this.onerror = null;
                "
            />
        </div>
    </body>
</html>
