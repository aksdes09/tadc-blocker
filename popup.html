<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            @font-face {
                font-family: "JetBrainsMono";
                src: url("JetBrainsMono-Regular.ttf") format("truetype");
                font-weight: normal;
                font-style: normal;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                width: 300px;
                background: #000;
                color: #e8e8e8;
                font-family: "JetBrainsMono", monospace;
                font-size: 13px;
            }
            .header {
                padding: 14px 16px;
                background: #000;
                border-bottom: 1px solid #1a1a1a;
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .header-icon {
                width: 34px;
                height: 34px;
                object-fit: contain;
                border-radius: 4px;
            }
            .header-title {
                font-size: 15px;
                font-weight: 600;
                color: #fff;
            }
            .header-sub {
                font-size: 11px;
                color: #888;
                margin-top: 1px;
            }

            .main-toggle {
                padding: 13px 16px;
                border-bottom: 1px solid #1a1a1a;
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: #000;
            }
            .main-toggle-label {
                font-size: 13px;
                font-weight: 500;
                color: #ddd;
            }

            .section {
                padding: 11px 16px;
                border-bottom: 1px solid #1a1a1a;
                background: #000;
            }
            .section-title {
                font-size: 10px;
                color: #666;
                text-transform: uppercase;
                letter-spacing: 0.07em;
                margin-bottom: 9px;
            }
            .option {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 7px;
            }
            .option:last-child {
                margin-bottom: 0;
            }
            .option-label {
                color: #ccc;
                font-size: 12px;
            }

            /* B&W toggle switch */
            .switch {
                position: relative;
                display: inline-block;
                width: 34px;
                height: 18px;
            }
            .switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }
            .slider {
                position: absolute;
                inset: 0;
                background: #000;
                border: 1px solid #2a2a2a;
                border-radius: 18px;
                cursor: pointer;
                transition: background 0.2s;
            }
            .slider:before {
                content: "";
                position: absolute;
                width: 12px;
                height: 12px;
                left: 2px;
                bottom: 2px;
                background: #444;
                border-radius: 50%;
                transition:
                    transform 0.2s,
                    background 0.2s;
            }
            input:checked + .slider {
                background: #000;
                border-color: #fff;
            }
            input:checked + .slider:before {
                transform: translateX(16px);
                background: #fff;
            }

            /* Keywords */
            .keywords-section {
                padding: 11px 16px;
                border-bottom: 1px solid #1a1a1a;
                background: #000;
            }
            .kw-list {
                margin: 7px 0;
                max-height: 88px;
                overflow-y: auto;
            }
            .kw-list::-webkit-scrollbar {
                width: 4px;
            }
            .kw-list::-webkit-scrollbar-thumb {
                background: #444;
                border-radius: 2px;
            }
            .kw-item {
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: #000;
                border: 1px solid #1e1e1e;
                border-radius: 5px;
                padding: 4px 8px;
                margin-bottom: 3px;
                font-size: 11px;
                color: #bbb;
                font-family: "JetBrainsMono", monospace;
            }
            .kw-remove {
                cursor: pointer;
                color: #888;
                font-size: 15px;
                line-height: 1;
                transition: color 0.1s;
            }
            .kw-remove:hover {
                color: #fff;
            }
            .kw-input-row {
                display: flex;
                gap: 6px;
                margin-top: 6px;
            }
            .kw-input {
                flex: 1;
                background: #000;
                border: 1px solid #1e1e1e;
                border-radius: 5px;
                padding: 5px 8px;
                color: #e0e0e0;
                font-size: 12px;
                outline: none;
                font-family: "JetBrainsMono", monospace;
                transition: border-color 0.15s;
            }
            .kw-input:focus {
                border-color: #555;
            }
            .kw-add {
                background: #fff;
                color: #000;
                border: none;
                border-radius: 5px;
                padding: 5px 10px;
                cursor: pointer;
                font-size: 13px;
                font-weight: 600;
                font-family: "JetBrainsMono", monospace;
                transition: background 0.15s;
            }
            .kw-add:hover {
                background: #ddd;
            }

            .footer {
                padding: 10px 16px;
                background: #000;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .status {
                font-size: 11px;
                color: #555;
            }
            .status.on {
                color: #e33b54;
            }
            .save-btn {
                background: #fff;
                color: #000;
                border: none;
                border-radius: 5px;
                padding: 6px 14px;
                cursor: pointer;
                font-size: 12px;
                font-weight: 600;
                font-family: "JetBrainsMono", monospace;
                transition: background 0.15s;
            }
            .save-btn:hover {
                background: #ddd;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <img class="header-icon" src="icon48.png" alt="TADC Blocker" />
            <div>
                <div class="header-title">TADC Blocker</div>
                <div class="header-sub" data-i18n="header_sub"></div>
            </div>
        </div>

        <div class="main-toggle">
            <span class="main-toggle-label" data-i18n="main_toggle"></span>
            <label class="switch">
                <input type="checkbox" id="toggle-enabled" />
                <span class="slider"></span>
            </label>
        </div>

        <div class="section">
            <div class="section-title" data-i18n="section_what"></div>
            <div class="option">
                <span class="option-label" data-i18n="opt_pages"></span>
                <label class="switch"
                    ><input type="checkbox" id="toggle-pages" /><span
                        class="slider"
                    ></span
                ></label>
            </div>
            <div class="option">
                <span class="option-label" data-i18n="opt_images"></span>
                <label class="switch"
                    ><input type="checkbox" id="toggle-images" /><span
                        class="slider"
                    ></span
                ></label>
            </div>
            <div class="option">
                <span class="option-label" data-i18n="opt_videos"></span>
                <label class="switch"
                    ><input type="checkbox" id="toggle-videos" /><span
                        class="slider"
                    ></span
                ></label>
            </div>
            <div class="option">
                <span class="option-label" data-i18n="opt_showblocked"></span>
                <label class="switch"
                    ><input type="checkbox" id="toggle-showblocked" /><span
                        class="slider"
                    ></span
                ></label>
            </div>
        </div>

        <div class="keywords-section">
            <div class="section-title" data-i18n="section_keywords"></div>
            <div class="kw-list" id="kw-list"></div>
            <div class="kw-input-row">
                <input
                    type="text"
                    class="kw-input"
                    id="kw-input"
                    data-i18n-placeholder="kw_placeholder"
                />
                <button class="kw-add" id="kw-add">+</button>
            </div>
        </div>

        <div class="footer">
            <span class="status" id="status-label"></span>
            <button
                class="save-btn"
                id="save-btn"
                data-i18n="btn_save"
            ></button>
        </div>

        <script src="popup.js"></script>
    </body>
</html>
